global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
  - job_name: requests_app
    static_configs:
      - targets: ['app:8080']
# Внимание! CADvisor должен быть всегда внизу. Это требование для создания тестового окружения. Пустую строку оставлять обязательно!
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
