events {
    worker_connections 1024;
}

http {
    log_format json_analytics escape=json '{'
        '"time": "$time_iso8601", '
        '"remote_addr": "$remote_addr", '
        '"request_id": "$request_id", '
        '"method": "$request_method", '
        '"url": "$request_uri", '
        '"status": "$status", '
        '"request_time": "$request_time", '
        '"upstream_response_time": "$upstream_response_time", '
        '"user_agent": "$http_user_agent"'
    '}';

    # 1. Сервер для обычного HTTP (порт 80)
    server {
        listen 80;
        server_name localhost;

        # Перенаправление всех запросов на безопасный https://
        return 301 https://$host$request_uri;
    }

    # 2. Сервер для безопасного HTTPS (порт 443)
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        access_log /dev/stdout json_analytics;

        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Добавим базовые security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        location / {
            proxy_pass http://app:8080;
        }

        location /health {
            proxy_pass http://app:8080/health; 
        }

        location /api/requests {
            proxy_pass http://app:8080/api/requests;
        }
    }
}