events {
    worker_connections 1024;
}

http {
    # Rate limiting — не более 10 запросов в секунду с одного IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Ограничение размера тела запроса
    client_max_body_size 1m;

    # JSON логирование
    log_format json_analytics escape=json '{'
        '"time": "$time_iso8601", '
        '"remote_addr": "$remote_addr", '
        '"request_id": "$request_id", '
        '"method": "$request_method", '
        '"url": "$request_uri", '
        '"status": "$status", '
        '"request_time": "$request_time", '
        '"upstream_response_time": "$upstream_response_time", '
        '"user_agent": "$http_user_agent"'
    '}';

    # 1. Сервер для обычного HTTP (порт 80). Перенаправляет на HTTPS
    server {
        listen 80;
        server_name localhost;

        # Перенаправление всех запросов на безопасный https://
        return 301 https://$host$request_uri;
    }

    # 2. Сервер для безопасного HTTPS (порт 443)
    server {
        listen 443 ssl;
        server_name localhost;

        # SSL-сертификаты
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # JSON логи в stdout
        access_log /dev/stdout json_analytics;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Проброс заголовков клиента в бэкенд (ваша настройка)
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header X-Forwarded-Proto $scheme;

        location / {
            proxy_pass http://app:8080;
        }

        location /health {
            proxy_pass http://app:8080/health;
        }

        location /api/requests {
            # Ограничение частоты запросов к API
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://app:8080/api/requests;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}