events {
    worker_connections 1024;
}

http {
    # Чистый JSON-формат без внутренних комментариев
    log_format json_analytics escape=json '{'
        '"time": "$time_iso8601", '
        '"remote_addr": "$remote_addr", '
        '"request_id": "$request_id", '
        '"method": "$request_method", '
        '"url": "$request_uri", '
        '"status": "$status", '
        '"request_time": "$request_time", '
        '"upstream_response_time": "$upstream_response_time", '
        '"user_agent": "$http_user_agent"'
    '}';

    server {
        listen 80;
        server_name localhost;

        # Пишем чистый JSON в stdout контейнера
        access_log /dev/stdout json_analytics;

        # Делаем X-Request-ID общим для всех локаций ниже
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        location / {
            proxy_pass http://app:8080;
        }

        location /health {
            proxy_pass http://app:8080/health; 
        }

        location /api/requests {
            proxy_pass http://app:8080/api/requests;
        }
    }
}