version: '3.9'

services:

  postgres:
    image: postgres:16

    container_name: requests_postgres

    environment:
      POSTGRES_USER: Oketraa
      POSTGRES_PASSWORD: 123456789
      POSTGRES_DB: requests_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .

    container_name: requests_app

    ports:
      - "8080:8080"

    environment:
      APP_PORT: 8080

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: Oketraa
      DB_PASSWORD: 123456789
      DB_NAME: requests_db

    depends_on:
      - postgres

volumes:
  postgres_data: